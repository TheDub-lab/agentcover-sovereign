[project]
name = "safety-protocol"
version = "0.7.1"
description = "Safety protocol framework for LLM agents — binding, scope, enforcement, monitoring, approval, audit, killswitch"
readme = "README.md"
# The published wheel is the MIT SDK only. The BSL platform layer lives in
# src/safety_protocol/platform/ and is excluded below; see LICENSING.md.
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Michael", email = "thislife1made@gmail.com"}
]
keywords = [
    "ai-agents",
    "agent-safety",
    "agent-governance",
    "authorization",
    "llm",
    "guardrails",
    "scope",
    "audit",
    "killswitch",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The guard, the scope linter, the audit trail and the reference deployment are
# all stdlib. `pip install safety-protocol` gives a working guard and the tests
# run with no network. Optional integrations are extras below.
dependencies = []

[project.optional-dependencies]
# Payment verification against a chain via a public JSON-RPC endpoint.
onchain = ["requests>=2.31"]
# Real EIP-3009 / USDC settlement signing (eth_account / secp256k1).
crypto = ["eth-account>=0.11"]
# The repo-root demo agent (Nebius Token Factory / Nemotron). Not packaged.
demo = ["openai>=1.30"]
# Ed25519 receipt signing for the BSL log receiver (platform layer).
receiver = ["cryptography>=42"]
# In-process tool-call guard for Strands Agents (safety_protocol.integrations).
strands = ["strands-agents>=1.0"]
# In-process tool-call guard for LangChain (safety_protocol.integrations).
langchain = ["langchain-core>=0.3"]
dev = ["pytest>=7.0", "ruff>=0.1.0", "build>=1.2", "twine>=5.0"]
all = ["requests>=2.31", "eth-account>=0.11"]

[project.scripts]
safety-guard = "safety_protocol.cli:main"

[project.urls]
Homepage = "https://github.com/TheDub-lab/agentcover-sovereign"
Repository = "https://github.com/TheDub-lab/agentcover-sovereign"
Issues = "https://github.com/TheDub-lab/agentcover-sovereign/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
# The BSL platform layer is distributed separately; keep it out of the wheel.
exclude = ["safety_protocol.platform", "safety_protocol.platform.*"]

[tool.setuptools.package-data]
safety_protocol = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Demo scripts (examples/ and the repo-root agent) predate this config and are
# not part of the shipped package; they are excluded rather than rewritten.
extend-exclude = ["examples", "sovereign_agent.py", "agent_capabilities.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line length is handled by the formatter, not the linter
]
